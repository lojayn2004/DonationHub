name: Run_TESTS_CI
on:
  push:
    branches: ['**']      
  pull_request:           
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Your_Strong_Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_Strong_Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_CONNECTION: Server=localhost,1433;Database=DonationHubTestDb;User Id=sa;Password=Your_Strong_Passw0rd;TrustServerCertificate=True
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Domain.UnitTests
        run: >
          dotnet test
          DontaionHub.Domain.UnitTests/DontaionHub.Domain.UnitTests.csproj
         
      - name: Run Application.UnitTests
        run: >
          dotnet test
          DontaionHub.Application.UnitTests/DontaionHub.Application.UnitTests.csproj
        
      - name: Run IntegrationTests
        run: >
          dotnet test
          DontaionHub.IntegrationTests/DontaionHub.IntegrationTests.csproj
          
