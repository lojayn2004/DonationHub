name: Run_TESTS_CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Your_Strong_Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_Strong_Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_CONNECTION: Server=localhost,1433;Database=DonationHubTestDb;User Id=sa;Password=Your_Strong_Passw0rd;TrustServerCertificate=True

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore DonationHub.slnx

      # ─────────────────────────────────────────────────────────────
      # 1) Domain unit tests
      # ─────────────────────────────────────────────────────────────
      - name: Run Domain.UnitTests
        run: >
          dotnet test
          DonationHub.Domain.UnitTests/DonationHub.Domain.UnitTests.csproj
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=domain-unittests.trx"
          --results-directory ./TestResults/Domain

      # ─────────────────────────────────────────────────────────────
      # 2) Application unit tests
      # ─────────────────────────────────────────────────────────────
      - name: Run Application.UnitTests
        run: >
          dotnet test
          DonationHub.Application.UnitTests/DonationHub.Application.UnitTests.csproj
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=application-unittests.trx"
          --results-directory ./TestResults/Application

      # ─────────────────────────────────────────────────────────────
      # 3) Integration tests (needs SQL Server)
      # ─────────────────────────────────────────────────────────────
      - name: Run IntegrationTests
        run: >
          dotnet test
          DontaionHub.IntegrationTests/DontaionHub.IntegrationTests.csproj
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=integrationtests.trx"
          --results-directory ./TestResults/Integration

    
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
